# The hand-kept judgment behind the roadmap page, rendered by tools/roadmap.py
# (docs/HACKING.md, Roadmap). Text fields are HTML. {review:<name>} names a [reviews] entry;
# #item-<slug> must name a feature in features.toml; blockers and soft are feature slugs.

base = '2dadc3b5'
title = 'What kaya builds next'
lede = 'Every open item scored three ways: how many apps need it, how many of fifteen GUI frameworks ship it, and what a slice of that shape has cost kaya on its own record. The order below follows from the scores; the cards say why each one landed where it did.'
state = "Since the 2026-10-04 read the timecode formatter shipped on five platforms, in nine bindings and on the C floor (2026-10-05), a drop's point is read on every lane (2026-10-06), and the day's matrix speed work took the full plain matrix from 2098 s to 1588 s, ALL PASS. With both pieces built, the video editor waits on nothing but the maintainer's choice of what to build before it."
menu_heading = 'The menu: the pieces first, then the apps they unblock'
menu_lede = "Every framework piece is its own entry, in the order recommended, and each names the demo app it unblocks; the apps follow, each listing what it still waits on, so an app is never picked with its pieces unbuilt. A star marks a piece that needs a ruling before any arm is written. With the task manager and the chat app shipped, the one demo app left is the video editor. Every ruling its plan asked is taken and every piece it names is built, the last two (the timecode formatter and a drop's point) on 2026-10-05 and 10-06, so the editor waits only on the maintainer's choice of what comes before it. The chat app's calls stage follows: capture and audio playback are built, and the one piece between them and a call is the far end, the peer's picture and voice. Read out of the surface promised against the surface built, the ledger's open headlines and the maintainer's own evidence order; the editor's pieces, the media reader and capture shipped between the reads and stay listed with their dates."
recommended_next = ''
recommended_note = "<b>Recommended next: open.</b> The maintainer said on 2026-10-06 that he wants more user-facing features before the video editor starts, and is choosing among them. The editor itself waits on nothing. The candidates are the far end of a call (ruled, the larger one), the three starred items (each needs a ruling first) and the Next tier's cards below, of which secure entry shipped 2026-10-07 (review page NzHtTqPdSgUPsAZVVm23He); the maintainer's own order from the 2026-10-06 shortlist was secure entry first."
demo_heading = 'The demo apps, and what each still waits on'
proposed_heading = 'Proposed: more demo apps, as milestones'
proposed_lede = "Proposed 2026-09-28 at the maintainer's ask, not ruled. Each demo is a milestone that forces a set of pieces no shipped app needs, taken from the archetype table below; the order puts the one that shares the most with the video editor first, so its pieces are built once for both. The webcam and the microphone (the maintainer, 2026-09-28: at least one demo must use them) go into the chat app as calls rather than a demo of their own, the way Signal and Slack carry them: the conversation, the simulated peer and the notifications are already there. The photo gallery and the video editor's voiceover would use the same capture piece more lightly. Nothing here starts until the maintainer picks."
proposed_after = ['The dashboard and developer-tool archetypes are left off: the portfolio already is the dashboard, and a tree view and a chart vocabulary would extend it rather than need a new app.', "Left off on purpose: packaging part 2 (on hold; its first need is self-contained bundles for the Go and foreign-language hosts), animations, tree view and OS background work (no design pass yet), and the multicolumn reflowing grid (waits on the maintainer's answer on size). The settings-heavy utility archetype is shipped by its pieces and has no demo app of its own."]
scored_lede = 'Score = 2×need + parity − 1.5×cost rank, for sorting only; the tier comes from rules stated under each tier heading, with a handful of overrides explained on the card. Click a column to sort, a chip to filter.'
archetypes_lede = 'Fifteen archetypes from the needs survey, each grounded in shipping apps: what kaya already has for it, what still blocks it, and the tier at which the last blocker clears under the order above.'
calibration_lede = 'Every cost class above is read off these: the shape of a shipped slice and the calendar days it took from design to a green five-lane matrix.'
method = ['Parity counts first-party support over the ten full toolkits (SwiftUI, Compose, Flutter, Qt, GTK4, WinUI 3, Avalonia, MAUI, React Native, Uno). Electron and Tauri are shells around a webview and the three Rust natives are an order of magnitude smaller, so they stay in the matrix for the system rows but do not set the bar. A package-only route counts half.', "Kaya has no package ecosystem. For every other toolkit a third of this list is a package away; for kaya each is first-party work on five backends or a hole. That is the architecture's cost and also its clearest differentiator, since nobody ships these natively everywhere.", 'Need is scored over fifteen app archetypes, a 105-app GNOME corpus counted by hand, the four vendor catalogues, Stack Overflow volume, issue votes across eleven frameworks, pub.dev dependency counts and store and legal obligation. Where the sources disagree the row says so rather than averaging: notifications scores 5 on four sources and never appeared in the native trackers; reduced motion scores 3 on legal obligation with no developer demand at all; the segmented control rests on the vendor catalogues alone.', "Cost is read off kaya's own record, not estimated from first principles: the calibration table is the whole basis. The record is fast because every slice is depth-then-breadth with agents fanning the breadth out, so a day here is a maintainer-with-agents day.", 'Six rows are here for honesty rather than as proposals: three already shipped in substance (indeterminate progress, tree-order focus, the app-side post primitive folded into the background row) and three refused by DESIGN (the native escape hatch, styling beyond the brand tier, device APIs). Code push is declined on the record because it is the loudest voice in the corpus.', "The score sorts; the tier decides. Tiers follow the rules stated under each heading, with the overrides named on their cards. Where the video editor's own blockers fall below the table stakes, that is the evidence speaking; the maintainer's forcing-artifact order is a legitimate reason to override it."]

