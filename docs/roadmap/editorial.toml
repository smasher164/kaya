status = 'open'
size = 'M each'
unblocks = 'the text editor, the portfolio, the task manager and the chat app'
review = 'restyle'
text = "BEGUN 2026-10-26 (5d7df248, facf3a63; review {review:restyle}): the music app's row styling in the chat app, the task manager's Projects screen and the editor's format bar, round pictures in the chat app, the editor's find bar on the basis of Sublime Text, Zed and VS Code. The portfolio and a unique look for each app are what is left. First asked for by the maintainer on 2026-10-15: once the styling pass is built (docs/styling-pass-plan.md, ruled 2026-10-15), go back to each earlier demo app and apply its vocabulary (data-colour grounds, image grounds with overlay panels, activatable cards with hover and selection, image shapes, tinted labels, the dock) to push each into its own unique, interesting look, within Y1's line that controls stay the platform's."

