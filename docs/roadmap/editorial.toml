[[axis]]
title = 'Need · 1 to 5'
text = 'How many of fifteen app archetypes cannot ship without it, read against a 105-app corpus, the four vendor catalogues, Stack Overflow volume, issue votes in eleven frameworks and store or legal obligation.'

[[axis]]
title = 'Parity · 1 to 5'
text = 'How many of the ten full toolkits (SwiftUI, Compose, Flutter, Qt, GTK4, WinUI 3, Avalonia, MAUI, React Native, Uno) ship it first-party, a package counting half; Electron, Tauri, egui, iced and Slint are in the matrix but do not set the bar. 5 means nine or ten.'

[[axis]]
title = 'Cost · S to XXL'
text = "Calibrated on kaya's delivery record below, not guessed: a native-everywhere prop is a day, a system surface two to four, a subsystem with core semantics four to seven, the web platform weeks."

[[tier]]
id = 'shipped'
lede = "Delivered since this page was first written on 2026-09-05, each with a review page and a matrix green on all five lanes. They came off the top of the order: the search field, the settings vocabulary (switch, badge, hyperlink, splash), notifications with the closed-app click, settings with window memory and the app's data, app links, and rich text (the editing surface, rich labels, named acts, the template zone), the compliance pass and sheets; then three the chat app pulled up from Later: the emoji picker, the badge on the app's icon and swipe actions on rows. From 2026-09-28 to 10-04 the video editor's pieces and media followed: horizontal scroll, fullscreen, the colour picker, the number field with its stepper, audio and video playback, and the camera, whose photo picker half shipped with the chat app and whose capture half on 2026-10-03. The timecode formatter and a drop's point followed on 2026-10-05 and 10-06, neither with a card of its own, and the full plain matrix was ALL PASS on 2026-10-06. Packaging shipped its first half and stays on hold for the second. From 2026-10-11 to 10-30: safe areas and keyboard avoidance, and document tabs native on every platform."

[[tier]]
id = 'now'
lede = 'Need 4 or 5 at a cost of S or M, or need 5 at L. The three items that made up this tier on 2026-09-21 were the compliance pass, and it shipped on 2026-09-24: dynamic type, localization and RTL mirroring sit under Shipped now. Nothing else qualifies by the rule, so the next slice comes from the menu above, where the video editor is recommended now that the user-facing features chosen first have shipped; its three starred items need a ruling first.'

[[tier]]
id = 'next'
lede = 'Need 4 at any cost up to XL, or need 3 when the slice is S or M and at least seven of ten toolkits ship it. These are the slices that open whole archetypes: the dashboard, the editor, the reader, commerce.'

[[tier]]
id = 'later'
lede = 'Need 3 with a real cost, or need 2 and cheap. Each names the trigger that moves it up; none blocks an archetype the two tiers above do not already block.'

[[tier]]
id = 'hold'
lede = "Need 2 or less with a carve-out or a subsystem's cost, plus the rows kept for honesty: already shipped in substance, or refused by DESIGN. Nothing here is proposed."

