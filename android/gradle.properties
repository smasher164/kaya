# The SDK comes from the nix store and is read-only; the build must never
# try to install components into it.
android.builder.sdkDownload=false
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2g
# compileSdk 36 is one platform ahead of what AGP 8.7.3 was tested
# against, and AGP says so on every build. It is DELIBERATE and the
# warning is the only thing 8.7.3 has to say about it: pattern matching
# for switch needs java.lang.runtime.SwitchBootstraps on the compile
# classpath and android-35's android.jar has none, while D8 desugars the
# typeSwitch for minSdk 26 (measured 2026-09-17, the APK's dex carries
# $$ExternalSyntheticTypeSwitch and no SwitchBootstraps reference).
android.suppressUnsupportedCompileSdk=36
