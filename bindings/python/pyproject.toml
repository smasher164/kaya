# The distribution is kaya-gui because PyPI's `kaya` is squatted; the
# import name stays `kaya`. Not a mismatch to fix.
[project]
name = "kaya-gui"
version = "0.0.0"
description = "Cross-platform native UI: the Python guest binding"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaya"]
