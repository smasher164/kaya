# The empty [workspace] must stay: `exclude` stops cargo at the repo's
# manifest and it keeps walking up. docs/traps.md: `exclude` does not stop
# cargo walking up, so a nested worktree claims tools/ packages
[workspace]

[package]
name = "kaya-bindgen"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
kaya = { path = "../../crates/kaya" }
