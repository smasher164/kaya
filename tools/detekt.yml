# The detekt configuration for tools/check-detekt.py.
#
# THE WHOLE CONFIG on purpose — passed without
# --build-upon-default-config, so a rule not named here does not run. The
# gate is about DEAD CODE, not style: a gate that fires on what the house
# style does deliberately is one people learn to skip.
#
# The Kotlin compiler cannot serve here: K2 moved the UNUSED_*
# diagnostics into IDE inspections (KT-69698), which is how a dead
# `val a11y` compiled clean through check-compose and check-verbs.
build:
  maxIssues: 0

style:
  active: true
  # An import nothing uses: the cheapest member of the family.
  UnusedImports:
    active: true
  # A parameter nothing reads — a lowering threaded a value in and
  # then forgot to apply it.
  UnusedParameter:
    active: true
  UnusedPrivateClass:
    active: true
  # A private function nothing calls: a helper written for a call site
  # that never landed.
  UnusedPrivateMember:
    active: true
  # THE rule this gate exists for: private properties AND local
  # variables that are never read. `val a11y = …` with no use site is
  # exactly this finding.
  UnusedPrivateProperty:
    active: true
