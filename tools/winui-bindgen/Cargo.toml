# ITS OWN ROOT, SAID OUT LOUD — tools/kaya-bindgen/Cargo.toml carries
# the same line and the reasoning: `exclude` stops cargo at the repo's
# manifest but it keeps walking up, so from a worktree nested under the
# repo the MAIN checkout's manifest claims this package and `cargo run`
# dies with "current package believes it's in a workspace when it's
# not". Measured here 2026-08-27 — a regeneration was skipped for it.
[workspace]

[package]
name = "winui-bindgen"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
regex-lite = "0.1.9"
windows-bindgen = "0.62"
