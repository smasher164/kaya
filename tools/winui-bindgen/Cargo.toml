# The empty [workspace] must stay — tools/kaya-bindgen/Cargo.toml has the
# reason. docs/traps.md: `exclude` does not stop cargo walking up, so a
# nested worktree claims tools/ packages
[workspace]

[package]
name = "winui-bindgen"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
regex-lite = "0.1.9"
windows-bindgen = "0.62"
