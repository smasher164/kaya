language = "C"
include_guard = "KAYA_H"
autogen_warning = "/* Generated by cbindgen. Do not edit by hand. */"

[export]
# KAYA_BUILD_ID_MARKER is exported so it survives into every artifact
# shape, but it is not API: nothing calls it or links against it. It
# exists to be read out of the FILE (tools/build-id.sh --verify), and a
# header entry would push it through gen-bindings into nine guest
# surfaces that have no use for it.
# napi_register_module_v1 is Node's contract (crates/kaya/src/node.rs),
# not the C ABI's: the header names what a C guest calls.
exclude = ["WidgetId", "KAYA_BUILD_ID_MARKER", "napi_register_module_v1"]
# Wire-format types: consumed by casting into the ring, so no exported
# function references them; force them into the header.
include = ["KayaRecordHeader", "KayaRecordButtonClicked", "KayaHostApi"]
