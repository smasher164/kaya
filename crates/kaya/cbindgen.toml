language = "C"
include_guard = "KAYA_H"
autogen_warning = "/* Generated by cbindgen. Do not edit by hand. */"

[export]
# KAYA_BUILD_ID_MARKER is read out of the artifact file (tools/build-id.py
# --verify), never called; napi_register_module_v1 is Node's contract
# (crates/kaya/src/node.rs), not the C ABI's. A header entry for either
# would push it through gen-bindings into nine guest surfaces.
# nl_langinfo and strfmon are glibc's, declared by fmt.rs's linux arm for its
# own calls; a header entry for either would hand the C floor a libc function.
exclude = ["WidgetId", "KAYA_BUILD_ID_MARKER", "napi_register_module_v1", "nl_langinfo", "strfmon"]
# Consumed by casting into the ring, so no exported function references
# them; force them into the header.
include = ["KayaRecordHeader", "KayaRecordButtonClicked", "KayaHostApi"]
