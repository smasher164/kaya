[package]
name = "kaya"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Cross-platform GUI library that wraps each platform's native widgets"
repository = "https://github.com/smasher164/kaya"

[lib]
# staticlib is for iOS, where app bundles prefer static linking and the
# Swift validation leg links libkaya.a directly.
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
# The scene-script harness: the parser, the Step vocabulary, all the
# verbs, and each backend's ~1000-line Stage implementation. OFF BY
# DEFAULT because none of it belongs in a shipped app — a user building
# a GUI should not carry kaya's test interpreter, and any dependency the
# harness needs (an AT-SPI/dbus client for the GTK accessibility read)
# would otherwise land in every user's binary to serve a verb only the
# suites ever call. The runners build with --features harness.
harness = ["dep:atspi"]

[dependencies]
# Compile-time only (proc-macro): #[derive(KayaGen)] — the type's shape
# is the schema.
kaya-derive = { path = "../kaya-derive" }

[build-dependencies]
# Emits msvc linker directives at build time; no-op for other targets.
static_vcruntime = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"
# Foundation_Collections: IObservableVector + VectorChangedEventHandler,
# ItemCollection's default interface (ComboBox.Items) — the pinned
# windows-collections 0.3 ships only the plain vector types, so the
# bindgen post-fix re-points the observable ones here.
# Foundation_Collections: see above. The file-dialog arm adds the Win32
# COM surface, and none of it needs the winmd bindgen — these are Win32
# namespaces the crate already carries, unlike the Microsoft.UI.* types
# in winui/bindings.rs.
#
# Win32_UI_Shell is IFileOpenDialog, the Shell's common item dialog.
# Shell_Common carries COMDLG_FILTERSPEC, and it is NOT optional even
# though only the filter uses it: windows-bindgen omits a method whose
# parameter types are outside the enabled feature set, so without it
# SetFileTypes does not exist and the error names the method rather than
# the missing feature. Win32_UI_Accessibility is UI Automation, which
# this backend needs because a #32770 dialog is not in the XAML object
# tree its other reads walk.
windows = { version = "0.62", features = [
    "Foundation_Collections",
    "Win32_System_Com",
    # The clipboard arm: classic Win32, DELIBERATELY — measured
    # 2026-08-03 (docs/clipboard-plan.md §6). WinRT DataTransfer's
    # SetContent works "only when the application is in the
    # foreground", which a matrix leg cannot promise; its custom-format
    # bridge to Win32 atoms is documented only in the read direction;
    # and its content dies with the process unless flushed. Classic
    # SetClipboardData has none of those charges: five formats set in
    # one open outlive the process and read back byte-exact through
    # stock PowerShell (tools/win/clipprobe). DataExchange is
    # OpenClipboard/SetClipboardData/RegisterClipboardFormatW;
    # Memory is the GlobalAlloc/GlobalLock family clipboard handles
    # ride on.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
# NO Win32_UI_Accessibility, DELIBERATELY, and this is a wall rather
# than a preference. UI Automation cannot be used against the Shell's
# file dialog from a guest process: attaching any automation client
# makes the shell's DirectUI raise event notifications during message
# dispatch, each an outgoing COM call that Windows refuses from a thread
# in an input-synchronous call, raising a NONCONTINUABLE
# RPC_E_CANTCALLOUT_ININPUTSYNCCALL inside the guest. COM handles it and
# four runtimes never notice; HotSpot's vectored exception handler on
# windows-aarch64 reports it as a fatal error and kills the java leg.
# Measured end to end; the read now goes through the shell's own
# IFolderView instead (winui/mod.rs, sample_folder_view).
#
# Leaving the feature off means a future attempt to reach for
# IUIAutomation fails `cargo build` here rather than dying as an
# unexplained JVM crash on one lane.
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    # DirectWrite — the layer BENEATH the XAML text stack, and the only
    # place a font question gets a measured answer in this process
    # (docs/styling-plan.md Slice 2b). Two calls, both of them things
    # XAML cannot say:
    #   IDWriteFontCollection::FindFamilyName — does this machine HAVE
    #     that family. `FontFamily.Source` answers the request back and
    #     nothing else, which is the read the slice forbids.
    #   IDWriteFontFallback::MapCharacters — the family an unresolvable
    #     request ACTUALLY renders in, named off the mapped font. The
    #     fallback name is a property of the lane image (Windows build ×
    #     locale × packaging; upstream microsoft-ui-xaml#10709 is still
    #     unanswered), so it is measured at run time and never a
    #     constant in this tree.
    # It carries NONE of UI Automation's hazard above: DirectWrite is a
    # local text API, not a cross-process automation client, so nothing
    # here can raise RPC_E_CANTCALLOUT_ININPUTSYNCCALL in a file dialog.
    "Win32_Graphics_DirectWrite",
    # Win32_UI_TextServices is the Text Services Framework, and it is
    # NOT UI Automation — the wall above is about attaching an automation
    # CLIENT, which reaches into other processes' UI; TSF is the input
    # stack of this process's own focused control. The harness's
    # `compose` verb needs it because Windows has no "insert marked text"
    # call: a composition belongs to TSF, so the verb starts one the way
    # a text service does (winui/mod.rs, tsf_compose). Without a real
    # composition the ranges scene's D4 leg would be asserting against
    # ordinary inserted text, which is the state the refusal exists to
    # tell a composition apart from.
    "Win32_UI_TextServices",
    # IShellBrowser derives from IOleWindow, so the metadata gates it
    # behind Ole. It is the route from the file dialog to the view it is
    # showing (sample_folder_view) — the read that replaced UI
    # Automation, which cannot be used against this dialog at all.
    "Win32_System_Ole",
] }
windows-numerics = "0.3"
windows-collections = "0.3"
# TextBox's metadata reaches IAsyncOperation (windows-bindgen emits
# windows_future paths for it).
windows-future = "0.3"
# The desktop JVM guest tier (jvm.rs): a plain JVM process loads the
# cdylib and speaks the same KayaRing natives as Android's JVM tier.
jni = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
# The desktop JVM guest tier (jvm.rs): a plain JVM process loads the
# cdylib and speaks the same KayaRing natives as Android's JVM tier.
jni = "0.21"

[target.'cfg(target_os = "linux")'.dependencies]
# The AT-SPI client, for the harness accessibility read ONLY — hence
# optional, pulled in by the `harness` feature, and Linux-only.
#
# GTK deliberately exposes no getter for accessible properties: the
# accessible surface IS AT-SPI, so reading it any other way would only
# read kaya's own writes back. That makes a dbus client the honest
# route, and makes it doubly important that it never reaches a shipped
# app — a GUI library has no business linking dbus to serve a test verb.
atspi = { version = "0.30", optional = true, features = ["zbus"] }
# v4_10 gates gtk::AlertDialog (the alert vocabulary's 1:1 dialog;
# 4.10+) and covers v4_6's gdk::Texture::from_bytes; the validation
# image ships GTK 4.18.
gtk4 = { version = "0.11.4", features = ["v4_10"] }
# Pango, named DIRECTLY (gtk4 already pulls it in) for one feature and
# one call: `v1_56` gates `PangoFontMap::add_font_file`, which is how a
# brand typeface's FONT BYTES reach the text system on this platform
# (docs/styling-plan.md Slice 2b, gtk.rs's register_font_blob).
#
# The documented alternative — fontconfig's `FcConfigAppFontAddFile` —
# was MEASURED returning success and doing nothing once GTK has
# initialised, which is every position a kaya apply can occupy; the pango
# call was measured working in that same position. The floor this sets is
# pango >= 1.56 on Linux, one minor version below the validation image's
# 1.56.3, and a build against anything older fails at link with the
# symbol named rather than falling back silently.
pango = { version = "0.22.8", features = ["v1_56"] }
# libadwaita: AdwNavigationSplitView is GNOME's list-detail component,
# and adopting it is what gives the platform its own collapse animation,
# pane proportions, separator, and back behaviour instead of geometry
# kaya computed for itself.
#
# v1_4 is the floor that gates NavigationSplitView and BreakpointBin,
# and it is deliberately not higher: the validation image ships
# libadwaita 1.7.6, so anything above 1.7 would compile here and fail
# there. Not optional — a semantics that appears only in some builds is
# not a semantics.
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"] }
# THE TWO DISPLAY BACKENDS, NAMED, so a declared app identity can move a
# window's CLASS — the string a Linux desktop matches a running window to
# an installed `.desktop` file by, and therefore what decides the launcher
# icon, the dock grouping and the switcher entry.
#
# `g_set_prgname` alone cannot do it. GDK reads the program name when it
# CREATES a surface, and this backend builds and presents its primary
# window in `run_core`'s activate handler, before the app thread's first
# transaction is drained — so a name arriving with the identity renames
# every later surface and leaves the primary wearing the launcher
# binary's name (MEASURED 2026-08-18: the identity leg's primary read
# `WM_CLASS(STRING) = "identity", "identity"` while its second window read
# `"Aurora Notes", "Aurora Notes"`). Moving an EXISTING surface's class is
# per-protocol, and each protocol's route lives in its own crate:
#
#   wayland — `gdk_wayland_toplevel_set_application_id`, which the xdg-shell
#     protocol explicitly allows after map ("Like other properties, a
#     set_app_id request can be sent after the xdg_toplevel has been mapped
#     to update the property").
#   x11 — `XSetClassHint` on the surface's xid. GDK4 exposes NO wrapper for
#     it: gdk4-x11's whole surface surface is xid/lookup/desktop/group/
#     frame-sync/skip-hints/theme-variant/urgency/user-time/utf8-property,
#     and `set_utf8_property` is not the route — WM_CLASS is ICCCM `STRING`,
#     two NUL-separated latin-1 words, and a `UTF8_STRING` copy of it is a
#     property with the right name and the wrong type. So the x11 arm needs
#     the display's Xlib connection (`xdisplay()`, the `xlib` feature) and
#     the Xlib call itself.
#
# `x11-dl` IS NOT A NEW NODE IN THE GRAPH: gdk4-x11's own `xlib` feature
# already requires it (it is that crate's `x11` dependency, package
# `x11-dl`), and naming it here is what makes `XSetClassHint` callable and
# what makes the pointer types line up with `xdisplay()`'s return by
# construction rather than by cast.
#
# The version floor is stated once, as gtk4's: one GTK install answers all
# three pkg-config modules (`gtk4`, `gtk4-x11`, `gtk4-wayland` all report
# 4.18.6 in the lane image).
gdk4-x11 = { version = "0.11.4", features = ["v4_10", "xlib"] }
gdk4-wayland = { version = "0.11.4", features = ["v4_10"] }
x11-dl = "2.20"
# The desktop JVM guest tier (jvm.rs): a plain JVM process loads the
# cdylib and speaks the same KayaRing natives as Android's JVM tier.
jni = "0.21"

[target.'cfg(target_os = "ios")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-ui-kit = "0.3.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "0.2"
# stdout/stderr go nowhere in an Android app process; logging and panics
# route to logcat instead.
log = "0.4"
android_logger = "0.15"
log-panics = "2"

