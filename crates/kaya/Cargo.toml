[package]
name = "kaya"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Cross-platform GUI library that wraps each platform's native widgets"
repository = "https://github.com/smasher164/kaya"

[lib]
# staticlib is iOS's: the Swift validation leg links libkaya.a directly.
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
# OFF BY DEFAULT: a shipped app must carry neither the scene interpreter
# nor a dependency only the suites' verbs need (atspi's dbus client).
# CLAUDE.md's validation ladder, rung 1; the runners pass it.
harness = ["dep:atspi"]

[dependencies]
kaya-derive = { path = "../kaya-derive" }

# The canvas raster stack (docs/canvas-plan.md §1.4, §4.1): CPU only and
# pure Rust on every target, which is what makes the byte-hash observable
# possible — a buffer whose pixels depend on a GPU driver is one no scene
# can freeze. A dependency here is never cited from memory (§4.1's
# archived-crate near-miss).
tiny-skia = "0.12.0"
# harfrust runs ON read-fonts by its own design, so the shaper and the
# outline scaler share ONE font parser.
harfrust = "0.13.3"
skrifa = "0.46.2"

[build-dependencies]
# Emits msvc linker directives at build time; no-op for other targets.
static_vcruntime = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.62"
# Foundation_Collections: the pinned windows-collections 0.3 ships only the
# plain vector types, so the bindgen post-fix re-points IObservableVector
# and VectorChangedEventHandler here.
#
# Shell_Common (COMDLG_FILTERSPEC) is NOT optional: windows-bindgen omits a
# method whose parameter types are outside the enabled feature set, so
# SetFileTypes silently would not exist (docs/traps.md: Show() with an owner
# on another thread never comes back).
windows = { version = "0.62", features = [
    "Foundation_Collections",
    "Win32_System_Com",
    # The clipboard arm is classic Win32, DELIBERATELY
    # (docs/clipboard-plan.md §6): WinRT DataTransfer's SetContent needs
    # the foreground and its content dies with the process.
    # DataExchange is OpenClipboard/SetClipboardData/
    # RegisterClipboardFormatW; Memory is the GlobalAlloc/GlobalLock
    # family clipboard handles ride on.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
# NO Win32_UI_Accessibility, DELIBERATELY. The absent feature IS the
# guard: reaching for IUIAutomation must fail `cargo build` here rather
# than dying as an unexplained JVM crash on one lane (docs/traps.md: UI
# Automation cannot read the Shell's file dialog from a guest). The read
# goes through the shell's own IFolderView (winui/mod.rs,
# sample_folder_view).
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    # DirectWrite is the layer BENEATH the XAML text stack, where a font
    # question gets a measured answer (docs/styling-plan.md Slice 2b):
    # FindFamilyName says whether the machine HAS a family (FontFamily
    # .Source only echoes the request back), MapCharacters names the
    # family an unresolvable request actually renders in. It carries none
    # of UI Automation's hazard above — a local text API is not a
    # cross-process automation client.
    "Win32_Graphics_DirectWrite",
    # TSF is NOT UI Automation: the wall above is about attaching an
    # automation CLIENT to other processes' UI; TSF is this process's own
    # input stack. The harness's `compose` verb needs it because Windows
    # has no "insert marked text" call — a composition belongs to TSF
    # (winui/mod.rs, tsf_compose).
    "Win32_UI_TextServices",
    # IShellBrowser derives from IOleWindow, so the metadata gates it
    # behind Ole; it is the route from the file dialog to the view it is
    # showing (sample_folder_view).
    "Win32_System_Ole",
    # The classic drop target the WinUI arm registers on the island HWND:
    # XAML's AllowDrop puts no OLE target on any of a WinUI window's four
    # HWNDs, so Explorer and every Win32 source arrive there or nowhere
    # (docs/probes/dnd-probe-windows-2026-09-03.md). SystemServices is
    # IDropTarget_Impl's MODIFIERKEYS_FLAGS and nothing else; NO
    # Win32_Graphics_Gdi, which STGMEDIUM's real declaration is gated on —
    # it re-declares the eight gdi32 entries this file already declares
    # with its own signatures, so the struct is hand-rolled beside the
    # drop target instead.
    "Win32_System_SystemServices",
    # IBufferByteAccess, the ONE way to reach a WinRT IBuffer's bytes
    # (docs/canvas-plan.md §8) — a classic COM interface out of
    # robuffer.h, so it comes from here and not from tools/winui-bindgen.
    "Win32_System_WinRT",
] }
windows-numerics = "0.3"
windows-collections = "0.3"
# TextBox's metadata reaches IAsyncOperation (windows-bindgen emits
# windows_future paths for it).
windows-future = "0.3"
# The desktop JVM guest tier (jvm.rs).
jni = "0.21"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
# The desktop JVM guest tier (jvm.rs).
jni = "0.21"

[target.'cfg(target_os = "linux")'.dependencies]
# The AT-SPI client, for the harness accessibility read ONLY — hence
# optional and behind `harness`. GTK exposes no getter for accessible
# properties (the accessible surface IS AT-SPI, so any other read would
# only read kaya's own writes back), and a GUI library has no business
# linking dbus into a shipped app to serve a test verb.
atspi = { version = "0.30", optional = true, features = ["zbus"] }
# v4_10 gates gtk::AlertDialog and covers v4_6's gdk::Texture::from_bytes.
# v4_12 IS THE CANVAS'S SCALE (docs/canvas-plan.md §5 rule 1):
# `gdk_surface_get_scale`'s double is the only reading that carries a
# fraction, while `gtk_widget_get_scale_factor` "returns the next higher
# integer value" under fractional scaling, so a 1.25 display would raster
# at 2 and blit a stale-size buffer.
gtk4 = { version = "0.11.4", features = ["v4_12"] }
# Pango named DIRECTLY (gtk4 already pulls it in) for `v1_56`, which gates
# `PangoFontMap::add_font_file` — the route a brand typeface's FONT BYTES
# take on this platform (docs/styling-plan.md Slice 2b, gtk.rs's
# register_font_blob). The documented alternative, fontconfig's
# `FcConfigAppFontAddFile`, returns success and does nothing once GTK has
# initialised (docs/deferred.md, the "DEPTH STUB: typeface on gtk" entry).
pango = { version = "0.22.8", features = ["v1_56"] }
# libadwaita: AdwNavigationSplitView is GNOME's list-detail component, so
# the platform's own collapse animation, pane proportions, separator and
# back behaviour replace geometry kaya computed for itself. v1_4 gates it
# and BreakpointBin, and is deliberately not higher — the validation image
# ships 1.7.6, so anything above 1.7 would compile here and fail there.
# Not optional: a semantics that appears only in some builds is not one.
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_4"] }
# BOTH display backends are named so a declared app identity can move an
# EXISTING surface's WM_CLASS/app_id (docs/app-identity-plan.md);
# `g_set_prgname` cannot, since GDK reads the program name when it CREATES a
# surface. Wayland takes `gdk_wayland_toplevel_set_application_id`, x11
# `XSetClassHint` through `xdisplay()` (the `xlib` feature), GDK4 wrapping it
# nowhere. x11-dl is gdk4-x11's own `xlib` dependency, named here so the
# pointer types line up.
gdk4-x11 = { version = "0.11.4", features = ["v4_10", "xlib"] }
gdk4-wayland = { version = "0.11.4", features = ["v4_10"] }
x11-dl = "2.20"
# The desktop JVM guest tier (jvm.rs).
jni = "0.21"

[target.'cfg(target_os = "ios")'.dependencies]
dispatch2 = "0.3.1"
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-ui-kit = "0.3.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "0.2"
# stdout/stderr go nowhere in an Android app process; logging and panics
# route to logcat instead.
log = "0.4"
android_logger = "0.15"
log-panics = "2"

